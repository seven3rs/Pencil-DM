name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dependency-audit:
    name: dependency audit (Rust and npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  linux-e2e:
    name: Linux desktop download smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop and engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf aria2 xvfb webkit2gtk-driver python3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri WebDriver adapter
        run: cargo install tauri-driver --locked
      - name: Build desktop application
        # tauri::generate_context!() picks between the bundled frontendDist and
        # the devUrl dev server based on the `custom-protocol` feature. The
        # `tauri build`/`tauri dev` CLIs pass it implicitly; a bare `cargo build`
        # does not, so without it the debug binary bakes in devUrl
        # (http://localhost:1420) and the WebView fails with "Could not connect
        # to localhost: Connection refused" since nothing is serving that port
        # in CI.
        run: cargo build -p pencil-download-manager --features tauri/custom-protocol
      - name: Run local HTTP download smoke test
        # ubuntu-22.04 ships aria2 1.36.0, but the app normally raises its minimum
        # to the latest upstream release (1.37.0) and would report the engine as
        # missing. Keep the embedded minimum for this test.
        env:
          PDM_SKIP_ENGINE_MINIMUM_REFRESH: "1"
        run: xvfb-run -a python3 scripts/linux-e2e-smoke.py target/debug/pencil-download-manager
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-failure-screenshot
          path: /tmp/pdm-e2e-failure.png
          if-no-files-found: ignore

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p pdm-engine --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p pdm-engine

  engine-bundle:
    name: bundled engine fetch + workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache fetched/built aria2
        uses: actions/cache@v4
        with:
          path: .engine-cache
          key: aria2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine-manifest.json', 'scripts/fetch-engine.mjs') }}
      # package-lock.json was generated on Linux, so it only pins Linux's optional
      # @rollup/rollup-* binary (npm/cli#4828); `npm ci` on Windows/macOS then has
      # no matching entry to install. `npm install` alone does not add it either, so
      # scripts/ensure-rollup-native.mjs installs the matching one (no-save).
      - run: npm install --no-audit --no-fund
      - run: node scripts/ensure-rollup-native.mjs
      - run: npm run build
      # Linux does not bundle aria2: only the pinned source tarball and COPYING are verified.
      - name: Verify pins (Linux)
        if: runner.os == 'Linux'
        run: node scripts/fetch-engine.mjs --verify-only
      - name: Fetch pinned aria2 sidecar (Windows)
        if: runner.os == 'Windows'
        run: node scripts/fetch-engine.mjs
      - name: Build aria2 for both macOS architectures
        if: runner.os == 'macOS'
        run: |
          node scripts/fetch-engine.mjs --target x86_64-apple-darwin
          node scripts/fetch-engine.mjs --target aarch64-apple-darwin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace
      - name: Show the sidecar files that were produced
        if: runner.os != 'Linux'
        shell: bash
        run: ls -l src-tauri/binaries src-tauri/resources/licenses/aria2

  version-sync:
    name: versions agree everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-versions.mjs

  release-guard-selftest:
    name: installers-only guard rejects forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release-assets.mjs --self-test

  windows-real-archive:
    name: engine real Windows archive layout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download the manifest-pinned Windows archive
        shell: pwsh
        run: |
          $manifest = Get-Content engine-manifest.json -Raw | ConvertFrom-Json
          $entry = $manifest.platforms.'windows-x86_64'
          $archive = Join-Path $env:RUNNER_TEMP 'aria2-windows.zip'
          Invoke-WebRequest -Uri $entry.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $entry.sha256.ToLowerInvariant()) { throw 'Downloaded archive hash does not match engine-manifest.json' }
          "PDM_REAL_WINDOWS_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify actual archive layout through the hardened extractor
        run: cargo test -p pdm-engine installs_real_windows_archive_when_supplied_by_ci -- --exact

  ui:
    name: ui (type-check, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  manifest:
    name: engine manifest matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-manifest.sh

  app-compiles:
    name: app compiles (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # tauri::generate_context! embeds ui/dist at compile time, so build the UI first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p pencil-download-manager
      - run: cargo test -p pencil-download-manager
      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
