name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dependency-audit:
    name: dependency audit (Rust and npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  linux-e2e:
    name: Linux desktop download smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop and engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf aria2 xvfb webkit2gtk-driver python3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri WebDriver adapter
        run: cargo install tauri-driver --locked
      - name: Build desktop application
        run: cargo build -p pencil-download-manager
      - name: Run local HTTP download smoke test
        run: xvfb-run -a python3 scripts/linux-e2e-smoke.py target/debug/pencil-download-manager
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-failure-screenshot
          path: /tmp/pdm-e2e-failure.png
          if-no-files-found: ignore

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p pdm-engine --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p pdm-engine

  windows-real-archive:
    name: engine real Windows archive layout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download the manifest-pinned Windows archive
        shell: pwsh
        run: |
          $manifest = Get-Content engine-manifest.json -Raw | ConvertFrom-Json
          $entry = $manifest.platforms.'windows-x86_64'
          $archive = Join-Path $env:RUNNER_TEMP 'aria2-windows.zip'
          Invoke-WebRequest -Uri $entry.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $entry.sha256.ToLowerInvariant()) { throw 'Downloaded archive hash does not match engine-manifest.json' }
          "PDM_REAL_WINDOWS_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify actual archive layout through the hardened extractor
        run: cargo test -p pdm-engine installs_real_windows_archive_when_supplied_by_ci -- --exact

  ui:
    name: ui (type-check, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  manifest:
    name: engine manifest matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-manifest.sh

  app-compiles:
    name: app compiles (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # tauri::generate_context! embeds ui/dist at compile time, so build the UI first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p pencil-download-manager
      - run: cargo test -p pencil-download-manager
      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
