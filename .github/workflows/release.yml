name: release

# Every platform uploads to the same DRAFT release. Nothing in this workflow
# publishes it: a human reviews the draft's assets and publishes manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installer names come from the committed version, not the tag. Fail before any
      # draft release or build exists if the tag and the files disagree.
      # Fix with: node scripts/set-version.mjs <version>, commit, and re-tag.
      - name: Tag matches the committed version
        if: github.ref_type == 'tag'
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"
      - run: bash scripts/verify-manifest.sh

  prepare-release:
    needs: verify-manifest
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Create or find the draft release
        id: release
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Pencil Download Manager $TAG_NAME" --notes "See the assets below to download and install."
          fi
          release_id=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify-manifest, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            target: ""
            args: "--bundles nsis"
            fetch: ""
            bundle_dir: target/release/bundle
          - name: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
            fetch: "--target aarch64-apple-darwin"
            bundle_dir: target/aarch64-apple-darwin/release/bundle
          - name: macos-x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
            fetch: "--target x86_64-apple-darwin"
            bundle_dir: target/x86_64-apple-darwin/release/bundle
          - name: linux-x64
            platform: ubuntu-22.04
            target: ""
            args: "--bundles deb,rpm"
            fetch: "--verify-only"
            bundle_dir: target/release/bundle
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # package-lock.json was generated on Linux, so it only pins Linux's optional
      # @rollup/rollup-* binary (npm/cli#4828); `npm ci` on Windows/macOS then has
      # no matching entry to install. `npm install` alone does not add it either, so
      # scripts/ensure-rollup-native.mjs installs the matching one (no-save).
      - run: npm install --no-audit --no-fund
      - run: node scripts/ensure-rollup-native.mjs

      - name: Cache fetched/built aria2
        uses: actions/cache@v4
        with:
          path: .engine-cache
          key: aria2-${{ matrix.name }}-${{ hashFiles('engine-manifest.json', 'scripts/fetch-engine.mjs') }}

      # Pinned URL + SHA-256, fatal on mismatch. Windows: official zip. macOS: built from
      # the pinned source tarball. Linux: only verifies the source pins (aria2 is not bundled).
      - name: Fetch or build pinned aria2
        run: node scripts/fetch-engine.mjs ${{ matrix.fetch }}

      - name: Prepare changelog notes for the update dialog
        id: release_notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md section found for $version; using the release summary."
            printf 'Pencil Download Manager %s. See the release page for details.\n' "$version" > "$RUNNER_TEMP/release-notes.md"
          fi
          {
            echo 'body<<PDM_RELEASE_NOTES'
            cat "$RUNNER_TEMP/release-notes.md"
            echo 'PDM_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Install Azure Trusted Signing CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_TENANT_ID -and $env:AZURE_TRUSTED_SIGNING_ENDPOINT -and $env:AZURE_TRUSTED_SIGNING_ACCOUNT -and $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE) {
            cargo install artifact-signing-cli --locked
          } else {
            Write-Host 'No complete Azure Trusted Signing configuration; using the PFX option if configured, otherwise unsigned.'
          }

      # Tauri tries to import APPLE_CERTIFICATE whenever the variable exists, even if empty,
      # so export the Apple secrets only when they are actually set (otherwise: unsigned build).
      - name: Configure Apple signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              val="${!v}"
              [ -n "$val" ] && { echo "::add-mask::$val"; printf '%s<<EOF_PDM\n%s\nEOF_PDM\n' "$v" "$val" >> "$GITHUB_ENV"; }
            done
          else
            echo "No Apple signing configuration; building an unsigned dmg."
          fi

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PFX (OV/EV) signing. The custom sign command is a no-op when absent.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Azure Trusted Signing. Used only when the PFX option is not configured.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Pencil Download Manager ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      # Fail the job if the bundle output holds anything but an allowed installer.
      - name: Installers-only guard
        shell: bash
        run: |
          version=$(node -p "require('./engine-manifest.json').version")
          node scripts/check-release-assets.mjs --version "$version" --dir "${{ matrix.bundle_dir }}"

  compliance:
    name: Attach aria2 source, COPYING, ENGINE-SOURCE.txt and SHA256SUMS
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify the exact aria2 source used
        run: node scripts/fetch-engine.mjs --verify-only
      - name: Write compliance files
        run: |
          set -euo pipefail
          version=$(jq -r .version engine-manifest.json)
          tag=$(jq -r .source.tag engine-manifest.json)
          srcsha=$(jq -r .source.sha256 engine-manifest.json)
          dir=$(jq -r .source.extract_dir engine-manifest.json)
          mkdir -p out
          cp ".engine-cache/aria2-${version}.tar.xz" "out/aria2-${version}.tar.xz"
          tar -xJOf "out/aria2-${version}.tar.xz" "$dir/COPYING" > out/COPYING
          {
            echo "aria2 version: ${version}"
            echo "Upstream tag: ${tag}"
            echo "Source tarball: aria2-${version}.tar.xz"
            echo "Source tarball SHA-256: ${srcsha}"
            echo
            echo "How the bundled engine was obtained:"
            echo "- Windows installers: official upstream prebuilt zip (URL and SHA-256 pinned in engine-manifest.json), binary hash verified, extracted unmodified."
            echo "- macOS installers (arm64, x64): built in CI from the source tarball above, unpatched, Apple system TLS, per-architecture."
            echo "- Linux packages (.deb, .rpm): aria2 is NOT bundled; the packages depend on the system aria2 package."
            echo
            echo "aria2 is licensed GPL-2.0-or-later with an OpenSSL exception (see COPYING)."
            echo "Pencil Download Manager is not affiliated with the aria2 project."
          } > out/ENGINE-SOURCE.txt
      - name: Checksums over every artifact, then upload
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          cp out/* dist/
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum -- * | sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber out/* dist/SHA256SUMS

  verify-assets:
    name: Verify the draft release holds only installers and compliance files
    needs: compliance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List actual release assets and apply the guard
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json
          test "$(jq -r .isDraft release.json)" = "true" || { echo "release is not a draft"; exit 1; }
          jq -r '.assets[].name' release.json | tee assets.txt
          node scripts/check-release-assets.mjs --version "$(jq -r .version engine-manifest.json)" --names-file assets.txt
