[package]
name = "pdm-engine"
version = "0.1.0"
edition = "2021"
description = "Verified install, launch and RPC client for the Pencil Download Manager download engine"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
which = "6"

[dev-dependencies]
tempfile = "3"
