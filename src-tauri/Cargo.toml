[package]
name = "pencil-download-manager"
version = "0.1.0"
description = "Pencil Download Manager"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
chrono = "0.4"
chrono-tz = "0.10"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
pdm-engine = { path = "../crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "io-util", "time"] }
tiny_http = "0.12"
rand = "0.8"
hex = "0.4"
url = "2"
dirs = "6"
# Bundled SQLite avoids requiring a system SQLite installation on end-user machines.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
